<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Employee Payroll</title>

    <!-- BOOTSTRAP CSS (SAFE) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet" />
    <!-- YOUR CSS -->
    <link rel="stylesheet" href="../Styles/style.css">
</head>

<body>

    <div class="container-fluid p-0">

        <!-- HEADER -->
        <div class="header">

            <div class="logo">
                <div class="logo-box bi bi-people"></div>
                <div class="logo-text">
                    <span>EMPLOYEE</span>
                    <span style="color:#42515F">PAYROLL</span>
                </div>
            </div>



        </div>


        <div id="alpha">
            <h3 id="empd">Employee Details</h3>
            <div class="header-actions">
                <div class="search-container">
                    <i class="bi bi-search search-icon" id="icon"></i>
                    <input type="text" class="form-control search-input" id="searchInput" placeholder="Search employees...">
                    <a href="add_user.html">
                        <button class="add-btn">+ Add User</button>
                    </a>
                </div>

            </div>
        </div>
        <!-- TABLE -->
        <div class="table-wrapper table-responsive">
            <table class=" table mb-0">
                <thead style="background-color: #42515F;">
                    <tr>
                        <!-- <th></th> -->
                        <th style="background-color: #42515F;color:white ">NAME</th>
                        <th style="background-color: #42515F;color:white">GENDER</th>
                        <th style="background-color: #42515F;color:white">DEPARTMENT</th>
                        <th style="background-color: #42515F;color:white">SALARY</th>
                        <th style="background-color: #42515F;color:white">START DATE</th>
                        <th style="background-color: #42515F;color:white">ACTIONS</th>
                    </tr>
                </thead>

                <tbody id="employeeTableBody">
                </tbody>
            </table>
        </div>

    </div>

    <!-- BOOTSTRAP JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="../Scripts/script.js"></script>

</body>

</html>
