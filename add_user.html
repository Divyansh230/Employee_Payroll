<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Add Employee</title>

    <!-- BOOTSTRAP CSS (SAFE) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- YOUR CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- HEADER (same as list page) -->
    <div class="header">

        <div class="logo">
            <div class="logo-box">EP</div>
            <div class="logo-text">
                <span>EMPLOYEE</span>
                <span style="color:#42515F">PAYROLL</span>
            </div>
        </div>

    </div>

    <!-- FORM CARD -->
    <div class="form-container">

        <h2 class="form-title">Employee Payroll Form</h2>

        <form class="employee-form">

            <!-- NAME -->
            <div class="form-row">
                <label>Name</label>
                <input type="text" placeholder="Enter Name" class="form-control">
            </div>

            <!-- PROFILE IMAGE -->
            <div class="form-row">
                <label>Profile Image</label>
                <div class="profile-images">
                    <input type="radio" name="profile">
                    <img src="https://randomuser.me/api/portraits/women/44.jpg">

                    <input type="radio" name="profile">
                    <img src="https://randomuser.me/api/portraits/men/32.jpg">

                    <input type="radio" name="profile">
                    <img src="https://randomuser.me/api/portraits/women/65.jpg">

                    <input type="radio" name="profile">
                    <img src="https://randomuser.me/api/portraits/men/45.jpg">
                </div>
            </div>

            <!-- GENDER -->
            <div class="form-row">
                <label>Gender</label>
                <div class="inline">
                    <label class="me-3">
                        <input type="radio" name="gender"> Male
                    </label>
                    <label>
                        <input type="radio" name="gender"> Female
                    </label>
                </div>
            </div>

            <!-- DEPARTMENT -->
            <div class="form-row">
                <label>Department</label>
                <div class="inline">
                    <label><input type="checkbox"> HR</label>
                    <label><input type="checkbox"> Sales</label>
                    <label><input type="checkbox"> Finance</label>
                    <label><input type="checkbox"> Engineer</label>
                    <label><input type="checkbox"> Others</label>
                </div>
            </div>

            <!-- SALARY -->
            <div class="form-row">
                <label>Salary</label>
                <select class="form-select">
                    <option>Select Salary</option>
                    <option>₹10,000</option>
                    <option>₹20,000</option>
                    <option>₹30,000</option>
                </select>
            </div>

            <!-- START DATE -->
            <div class="form-row">
                <label>Start Date</label>
                <div class="inline">
                    <select class="form-select"><option>Day</option></select>
                    <select class="form-select"><option>Month</option></select>
                    <select class="form-select"><option>Year</option></select>
                </div>
            </div>

            <!-- NOTES -->
            <div class="form-row">
                <label>Notes</label>
                <textarea rows="3" class="form-control"></textarea>
            </div>

            <!-- BUTTONS -->
            <div class="form-actions">
                <a href="index.html" class="btn gray">Cancel</a>
                <button type="submit" class="btn green">Submit</button>
                <button type="reset" class="btn gray">Reset</button>
            </div>

        </form>
    </div>

    <!-- BOOTSTRAP JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
